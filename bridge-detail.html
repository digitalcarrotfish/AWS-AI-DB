  <style>

    .hero-corner-br { position: absolute; bottom: 14px; left: 14px; width: 18px; height: 18px; border-bottom: 2px solid rgba(180, 150, 100, 0.38); border-left: 2px solid rgba(180, 150, 100, 0.38); pointer-events: none; }

    /* 图片点击放大灯箱 */
    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: rgba(0,0,0,0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.25s ease, visibility 0.25s ease;
    }
    .lightbox.open {
      opacity: 1;
      visibility: visible;
    }
    .lightbox-inner {
      position: relative;
      max-width: 95vw;
      max-height: 90vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .lightbox-inner img,
    .lightbox-inner .lightbox-svg {
      max-width: 95vw;
      max-height: 90vh;
      width: auto;
      height: auto;

    .lightbox-inner .lightbox-svg svg { max-width: 100%; height: auto; display: block; }

      height: 36px;
      border: 1px solid rgba(160, 130, 85, 0.4);

  <script>
    (function() {
      function t(k, v) { return window.BridgeI18n ? window.BridgeI18n.t(k, v) : k; }
      function f(zh) { return window.BridgeI18n ? window.BridgeI18n.field(zh) : zh; }
      function bn(zh) { return window.BridgeI18n ? window.BridgeI18n.bridgeName(zh) : zh; }
      function yl(year) { return window.BridgeI18n ? window.BridgeI18n.yearLabel(year) : String(year); }
      function bi(b) { return window.BridgeI18n ? window.BridgeI18n.bridgeIntro(b) : (b && b.intro) || ''; }

      var params = new URLSearchParams(window.location.search);
      var name = (params.get('name') || '').trim();
      if (!name && window.location.hash) name = decodeURIComponent(window.location.hash.slice(1)).trim();
      var fromYear = params.get('fromYear') || '';

      function backUrl() { return fromYear ? 'museum.html?year=' + encodeURIComponent(fromYear) : 'museum.html'; }

      var bridge = null;
      var bridges = [];

      var bridgeFolder = '桥/';
      function tryImageWithFallback(container, urls, fallbackHtml, imgClassName, onSuccess) {
        if (!urls.length) { container.innerHTML = fallbackHtml; return; }
        var img = document.createElement('img');
        img.alt = '';
        if (imgClassName) img.className = imgClassName;
        img.onload = function() { if (onSuccess) onSuccess(); };
        img.onerror = function() {
          tryImageWithFallback(container, urls.slice(1), fallbackHtml, imgClassName, onSuccess);
        };
        img.src = urls[0];
        container.innerHTML = '';
        container.appendChild(img);
      }
      function getLineArtUrls(name) {
        return [bridgeFolder + name + ' 线稿图.png', bridgeFolder + name + '  线稿图.png'];
      }
      function getAppearanceUrls(name) {
        return [bridgeFolder + name + ' 外观图.jpg', bridgeFolder + name + ' 外观图.png'];
      }
      function getStructureSvg(type) {
        type = type || '拱桥';
        var w = 280, h = 120;
        if (type === '拱桥') {
          return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + w + ' ' + h + '" width="100%" style="max-width:280px">' +
            '<path d="M40,100 L40,70 Q140,20 240,70 L240,100" fill="none" stroke="#7f8c8d" stroke-width="2"/>' +
            '<line x1="40" y1="100" x2="240" y2="100" stroke="#95a5a6" stroke-width="1.5"/>' +
            '<path d="M90,100 V70 M140,100 V50 M190,100 V70" fill="none" stroke="#6c757d" stroke-width="1"/>' +
            '<text x="140" y="115" text-anchor="middle" fill="#c9a87a" font-size="10">拱券 · 桥面</text></svg>';
        }
        if (type === '梁桥') {
          return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + w + ' ' + h + '" width="100%" style="max-width:280px">' +
            '<rect x="20" y="75" width="240" height="8" fill="none" stroke="#7f8c8d" stroke-width="2"/>' +
            '<line x1="60" y1="100" x2="60" y2="83" stroke="#95a5a6" stroke-width="1.5"/>' +
            '<line x1="140" y1="100" x2="140" y2="83" stroke="#95a5a6" stroke-width="1.5"/>' +
            '<line x1="220" y1="100" x2="220" y2="83" stroke="#95a5a6" stroke-width="1.5"/>' +
            '<text x="140" y="115" text-anchor="middle" fill="#c9a87a" font-size="10">梁 · 桥墩</text></svg>';
        }
        if (type === '索桥') {
          return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + w + ' ' + h + '" width="100%" style="max-width:280px">' +
            '<path d="M20,60 Q140,30 260,60" fill="none" stroke="#457b9d" stroke-width="1.5"/>' +
            '<path d="M20,75 Q140,45 260,75" fill="none" stroke="#457b9d" stroke-width="1.5"/>' +
            '<line x1="20" y1="100" x2="20" y2="60" stroke="#6c757d" stroke-width="1"/>' +
            '<line x1="260" y1="100" x2="260" y2="60" stroke="#6c757d" stroke-width="1"/>' +
            '<line x1="50" y1="68" x2="50" y2="72" stroke="#7f8c8d" stroke-width="1"/>' +
            '<line x1="140" y1="52" x2="140" y2="78" stroke="#7f8c8d" stroke-width="1"/>' +
            '<line x1="230" y1="68" x2="230" y2="72" stroke="#7f8c8d" stroke-width="1"/>' +
            '<text x="140" y="115" text-anchor="middle" fill="#c9a87a" font-size="10">索 · 锚碇</text></svg>';
        }
        if (type === '浮桥') {
          return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + w + ' ' + h + '" width="100%" style="max-width:280px">' +
            '<path d="M30,85 L80,85 L130,85 L180,85 L250,85" fill="none" stroke="#8b7355" stroke-width="2"/>' +
            '<rect x="45" y="70" width="35" height="18" rx="2" fill="none" stroke="#95a5a6" stroke-width="1"/>' +
            '<rect x="115" y="70" width="35" height="18" rx="2" fill="none" stroke="#95a5a6" stroke-width="1"/>' +
            '<rect x="185" y="70" width="35" height="18" rx="2" fill="none" stroke="#95a5a6" stroke-width="1"/>' +
            '<path d="M20,95 Q140,92 260,95" fill="none" stroke="#457b9d" stroke-width="1" opacity="0.8"/>' +
            '<text x="140" y="115" text-anchor="middle" fill="#c9a87a" font-size="10">舟体 · 浮梁</text></svg>';
        }
        return getStructureSvg('拱桥');
      }

      /** 对比条须在两张图都 fallback 成功并 onload 后再赋 src，否则会把首张失败 URL 写进对比区导致裂图 */
      function syncCompareSlider() {
        var compareWrap = document.getElementById('compareSliderWrap');
        var compareApp = document.getElementById('compareAppearance');
        var compareLine = document.getElementById('compareLineart');
        var compareDiv = document.getElementById('compareDivider');
        var appearanceBox = document.getElementById('appearanceBox');
        var structureBox = document.getElementById('structureSvg');
        if (!compareWrap || !compareApp || !compareLine || !compareDiv || !appearanceBox || !structureBox) return;
        var appearanceImg = appearanceBox.querySelector('img');
        var lineArtImg = structureBox.querySelector('img');
        if (!appearanceImg || !lineArtImg) {
          compareWrap.style.display = 'none';
          return;
        }
        if (!appearanceImg.complete || !appearanceImg.naturalWidth || !lineArtImg.complete || !lineArtImg.naturalWidth) {
          return;
        }
        compareWrap.style.display = 'block';
        compareApp.src = appearanceImg.src;
        compareLine.src = lineArtImg.src;
        var rightPanel = compareWrap.querySelector('.compare-right');
        var pct = 50;
        function setCompare(p) {
          pct = Math.max(2, Math.min(98, p));
          compareDiv.style.left = pct + '%';
          if (rightPanel) rightPanel.style.clipPath = 'inset(0 0 0 ' + pct + '%)';
        }
        setCompare(50);
        compareDiv.onmousedown = function(e) {
          e.preventDefault();
          function move(e2) {
            var rect = compareWrap.querySelector('.compare-slider').getBoundingClientRect();
            setCompare(((e2.clientX - rect.left) / rect.width) * 100);
          }
          function up() {
            document.removeEventListener('mousemove', move);
            document.removeEventListener('mouseup', up);
          }
          document.addEventListener('mousemove', move);
          document.addEventListener('mouseup', up);
        };
      }

      function getAppearanceSvg(type) {
        type = type || '拱桥';
        var w = 280, h = 140;
        if (type === '拱桥') {
          return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + w + ' ' + h + '" width="100%" style="max-width:280px">' +
            '<defs><linearGradient id="g1" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#4a5568"/><stop offset="100%" stop-color="#2d3748"/></linearGradient></defs>' +
            '<ellipse cx="140" cy="125" rx="100" ry="8" fill="rgba(69,123,157,0.3)"/>' +
            '<path d="M45,95 Q140,35 235,95 L235,100 L45,100 Z" fill="url(#g1)" stroke="#718096" stroke-width="1"/>' +
            '<path d="M45,100 Q140,42 235,100" fill="none" stroke="#a0aec0" stroke-width="1.5"/>' +
            '<text x="140" y="20" text-anchor="middle" fill="#c9a87a" font-size="11">石拱桥外观示意</text></svg>';
        }
        if (type === '梁桥') {
          return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + w + ' ' + h + '" width="100%" style="max-width:280px">' +
            '<defs><linearGradient id="g2" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#5a4a3a"/><stop offset="100%" stop-color="#3d3228"/></linearGradient></defs>' +
            '<rect x="30" y="75" width="220" height="12" fill="url(#g2)" stroke="#8b7355" stroke-width="1"/>' +
            '<rect x="70" y="88" width="12" height="35" fill="#4a5568" stroke="#718096"/>' +
            '<rect x="138" y="88" width="12" height="35" fill="#4a5568" stroke="#718096"/>' +
            '<rect x="206" y="88" width="12" height="35" fill="#4a5568" stroke="#718096"/>' +
            '<text x="140" y="20" text-anchor="middle" fill="#c9a87a" font-size="11">石梁桥外观示意</text></svg>';
        }
        if (type === '索桥') {
          return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + w + ' ' + h + '" width="100%" style="max-width:280px">' +
            '<path d="M25,55 Q140,25 255,55" fill="none" stroke="#2c5282" stroke-width="3"/>' +
            '<path d="M25,68 Q140,38 255,68" fill="none" stroke="#2c5282" stroke-width="2"/>' +
            '<line x1="25" y1="100" x2="25" y2="55" stroke="#4a5568" stroke-width="2"/>' +
            '<line x1="255" y1="100" x2="255" y2="55" stroke="#4a5568" stroke-width="2"/>' +
            '<ellipse cx="140" cy="125" rx="110" ry="6" fill="rgba(69,123,157,0.2)"/>' +
            '<text x="140" y="20" text-anchor="middle" fill="#c9a87a" font-size="11">铁索桥外观示意</text></svg>';
        }
        if (type === '浮桥') {
          return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + w + ' ' + h + '" width="100%" style="max-width:280px">' +
            '<ellipse cx="140" cy="120" rx="120" ry="10" fill="rgba(69,123,157,0.4)"/>' +
            '<rect x="50" y="85" width="45" height="25" rx="3" fill="#5a4a3a" stroke="#8b7355"/>' +
            '<rect x="115" y="85" width="45" height="25" rx="3" fill="#5a4a3a" stroke="#8b7355"/>' +
            '<rect x="185" y="85" width="45" height="25" rx="3" fill="#5a4a3a" stroke="#8b7355"/>' +
            '<path d="M35,95 L245,95" stroke="#7f8c8d" stroke-width="2"/>' +
            '<text x="140" y="20" text-anchor="middle" fill="#c9a87a" font-size="11">浮桥外观示意</text></svg>';
        }
        return getAppearanceSvg('拱桥');
      }

      function buildDefaultIntro(b) {
        var y = '';
        if (b.year != null) y = b.year < 0 ? '约公元前 ' + (-b.year) + ' 年' : '约公元 ' + b.year + ' 年';
        var lines = [
          b.name + '位于' + (b.province || '') + (b.city || '') + '，是一座' + (b.dynasty || '') + '时期的' + (b.type || '古桥') + '。',
          y ? '年代参考：' + y + '。' : '',
          (b.length != null || b.span != null || b.width != null)
            ? '尺度概览：' + [
                b.length != null ? '桥长约 ' + b.length + ' 米' : null,
                b.span != null ? '最大单孔跨度约 ' + b.span + ' 米' : null,
                b.width != null ? '桥面宽约 ' + b.width + ' 米' : null
              ].filter(Boolean).join('；') + '。'
            : '',
          (b.material ? '主要材质：' + b.material + '。' : ''),
          (b.poetry ? '文化印记：「' + b.poetry + '」。' : '')
        ].filter(function(s) { return s; });
        return lines.join('\n\n');
      }

      function normalizeEmbedUrl(url) {
        if (!url || typeof url !== 'string') return '';
        var u = url.trim();
        if (u.indexOf('//') === 0) u = 'https:' + u;
        if (/bilibili\.com/i.test(u)) {
          u = u.replace(/([?&])autoplay=1/gi, '$1autoplay=0');
          if (!/[?&]autoplay=/i.test(u)) u += (u.indexOf('?') >= 0 ? '&' : '?') + 'autoplay=0';
        }
        if (/youtube\.com|youtu\.be/i.test(u)) {
          u = u.replace(/([?&])autoplay=1/gi, '$1autoplay=0');
          if (!/[?&]autoplay=/i.test(u)) u += (u.indexOf('?') >= 0 ? '&' : '?') + 'autoplay=0';
        }
        return u;
      }

      function mountVideoEmbeds(container) {
        if (!container) return;
        var blocks = container.querySelectorAll('.video-embed--idle');
        blocks.forEach(function (block) {
          var embed = block.getAttribute('data-embed');
          var title = block.getAttribute('data-title') || '视频';
          if (!embed) return;
          function activate() {
            if (block.getAttribute('data-loaded') === '1') return;
            block.setAttribute('data-loaded', '1');
            block.classList.remove('video-embed--idle');
            block.innerHTML =
              '<iframe src="' + embed.replace(/"/g, '&quot;') + '" title="' + title.replace(/"/g, '&quot;') + '" allowfullscreen allow="accelerometer; clipboard-write; encrypted-media; gyroscope; picture-in-picture"></iframe>';
          }
          var btn = block.querySelector('.video-play-btn');
          if (btn) btn.addEventListener('click', function (e) { e.stopPropagation(); activate(); });
          block.addEventListener('click', function (e) {
            if (e.target === block || e.target.classList.contains('video-play-hint')) activate();
          });
        });
      }

      var speechSynth = window.speechSynthesis || null;
      var introSpeakHandlers = null;

      function setupIntroSpeech(introPlain) {
        var btnSpeak = document.getElementById('btnSpeak');
        var btnPause = document.getElementById('btnPauseSpeech');
        var btnStop = document.getElementById('btnStopSpeech');
        var voiceBar = document.getElementById('voiceBar');
        /* 不用 speechSynth.paused 驱动文案（Safari 等常不同步），按用户点击切换 */
        var userPausedSpeech = false;
        function applyPauseButtonLabel() {
          if (!btnPause) return;
          if (userPausedSpeech) {
            btnPause.textContent = (window.BridgeI18n && window.BridgeI18n.getLang()==='en') ? 'Resume' : '继续';
            btnPause.title = '继续朗读';
            btnPause.setAttribute('aria-label', '继续朗读');
          } else {
            btnPause.textContent = t('detail.pause');
            btnPause.title = '暂停朗读';
            btnPause.setAttribute('aria-label', '暂停朗读');
          }
        }
        function setVoiceActive(active) {
          if (!voiceBar) return;
          if (!active) userPausedSpeech = false;
          voiceBar.classList.toggle('voice-active', !!active);
          if (btnPause) {
            btnPause.setAttribute('aria-hidden', active ? 'false' : 'true');
            btnPause.setAttribute('tabindex', active ? '0' : '-1');
            if (active) userPausedSpeech = false;
            applyPauseButtonLabel();
          }
          if (btnStop) {
            btnStop.setAttribute('aria-hidden', active ? 'false' : 'true');
            btnStop.setAttribute('tabindex', active ? '0' : '-1');
          }
        }
        if (!btnSpeak || !speechSynth) {
          if (btnSpeak) btnSpeak.disabled = true;
          if (btnPause) btnPause.disabled = true;
          if (btnStop) btnStop.disabled = true;
          setVoiceActive(false);
          return;
        }
        if (introSpeakHandlers) {
          introSpeakHandlers.forEach(function(off) { off(); });
          introSpeakHandlers = null;
        }
        setVoiceActive(false);
        var speakGen = 0;
        function cancelSpeech() {
          try { speechSynth.cancel(); } catch (e) {}
        }
        function onSpeak() {
          speakGen++;
          var g = speakGen;
          cancelSpeech();
          setVoiceActive(false);
          var u = new SpeechSynthesisUtterance(introPlain);
          u.lang = 'zh-CN';
          u.rate = 0.92;
          u.pitch = 1;
          var voices = speechSynth.getVoices();
          for (var i = 0; i < voices.length; i++) {
            if (voices[i].lang && voices[i].lang.indexOf('zh') === 0) {
              u.voice = voices[i];
              break;
            }
          }
          u.onstart = function() { if (g === speakGen) setVoiceActive(true); };
          u.onend = function() { if (g === speakGen) setVoiceActive(false); };
          u.onerror = function() { if (g === speakGen) setVoiceActive(false); };
          speechSynth.speak(u);
        }
        function onPause() {
          if (!speechSynth) return;
          if (userPausedSpeech) {
            try { speechSynth.resume(); } catch (e) {}
            userPausedSpeech = false;
          } else {
            try { speechSynth.pause(); } catch (e) {}
            userPausedSpeech = true;
          }
          applyPauseButtonLabel();
        }
        function onStop() {
          cancelSpeech();
          setVoiceActive(false);
        }
        btnSpeak.onclick = onSpeak;
        btnPause.onclick = onPause;
        btnStop.onclick = onStop;
        btnSpeak.disabled = false;
        btnPause.disabled = false;
        btnStop.disabled = false;
        introSpeakHandlers = [
          function() {
            btnSpeak.onclick = null;
            btnPause.onclick = null;
            btnStop.onclick = null;
            cancelSpeech();
            setVoiceActive(false);
          }
        ];
        if (speechSynth.getVoices().length === 0) {
          speechSynth.addEventListener('voiceschanged', function once() {
            speechSynth.removeEventListener('voiceschanged', once);
          });
        }
      }

      function renderIntroAndVideos(b) {
        var introCard = document.getElementById('introCard');
        var introEl = document.getElementById('introText');
        var audioWrap = document.getElementById('voiceAudioWrap');
        var text = (b.intro && String(b.intro).trim()) ? String(b.intro).trim() : buildDefaultIntro(b);
        if (introEl) introEl.textContent = bi(b) || text || t('detail.noIntro');
        if (audioWrap) {
          audioWrap.innerHTML = '';
          audioWrap.style.display = 'none';
          if (b.audioUrl && String(b.audioUrl).trim()) {
            var au = document.createElement('audio');
            au.controls = true;
            au.preload = 'metadata';
            au.src = String(b.audioUrl).trim();
            audioWrap.appendChild(au);
            var cap = document.createElement('p');
            cap.className = 'voice-hint';
            cap.style.marginTop = '8px';
            cap.textContent = '预录讲解音频';
            audioWrap.appendChild(cap);
            audioWrap.style.display = 'block';
          }
        }
        if (introCard) introCard.style.display = 'block';
        setupIntroSpeech(text);

        var videoCard = document.getElementById('videoCard');
        var videoList = document.getElementById('videoList');
        var videos = b.videos;
        if (!videos || !videos.length) {
          if (videoCard) videoCard.style.display = 'none';
          return;
        }
        if (videoList) {
          videoList.innerHTML = videos.map(function(v, idx) {
            var title = (v && v.title) ? v.title : '视频 ' + (idx + 1);
            var embed = normalizeEmbedUrl(v && (v.embed || v.embedUrl || v.src || v.url));
            if (!embed) return '';
            return (
              '<div class="video-item">' +
              '<h3>' + title.replace(/</g, '&lt;') + '</h3>' +
              '<div class="video-embed video-embed--idle" data-embed="' + embed.replace(/"/g, '&quot;') + '" data-title="' + title.replace(/"/g, '&quot;') + '">' +
              '<button type="button" class="video-play-btn">' + t('detail.playVideo') + '</button>' +
              '<span class="video-play-hint">' + t('detail.playHint') + '</span>' +
              '</div>' +
              '</div>'
            );
          }).filter(Boolean).join('');
          mountVideoEmbeds(videoList);
        }
        if (videoCard) videoCard.style.display = videoList && videoList.innerHTML.trim() ? 'block' : 'none';
      }

      function formatProtection(bridge) {
        var val = bridge && bridge.protection;
        var batch = bridge && bridge.protectionBatch;
        var batchLabel = batch ? f(batch) : '';
        if (!val) return '—';
        if (val === '国保') {
          return batch ? t('detail.nationalHeritage', { batch: batchLabel }) : t('detail.nationalHeritageDefault');
        }
        if (val === '省保') {
          return batch
            ? (window.BridgeI18n && window.BridgeI18n.getLang() === 'en' ? 'Provincial heritage (' + batchLabel + ')' : '省级文物保护单位（' + batch + '）')
            : (window.BridgeI18n && window.BridgeI18n.getLang() === 'en' ? 'Provincial heritage' : '省级文物保护单位');
        }
        if (val === '市保') {
          return batch
            ? (window.BridgeI18n && window.BridgeI18n.getLang() === 'en' ? 'Municipal heritage (' + batchLabel + ')' : '市级文物保护单位（' + batch + '）')
            : (window.BridgeI18n && window.BridgeI18n.getLang() === 'en' ? 'Municipal heritage' : '市级文物保护单位');
        }
        var otherZh = { '已毁': '已毁（历史上存在，今不存）', '遗址': '遗址（考古遗存）', '多次重修': '多次重修（历代有维修）', '多次毁修': '多次毁修（历代有毁建）' };
        var otherEn = { '已毁': 'Destroyed (historical; no longer extant)', '遗址': 'Archaeological site', '多次重修': 'Repeatedly repaired', '多次毁修': 'Repeatedly destroyed and rebuilt' };
        if (window.BridgeI18n && window.BridgeI18n.getLang() === 'en') return otherEn[val] || f(val) || val;
        return otherZh[val] || val;
      }

      function escapeHtml(s) {
        if (s == null || s === '') return '';
        var d = document.createElement('div');
        d.textContent = s;
        return d.innerHTML;
      }

      function renderPoetryRich(b, entry) {
        var el = document.getElementById('poetryRich');
        if (!el) return;
        var hasRich = entry && (entry.anecdote || entry.poetryRefs || entry.culturalInsight);
        if (!hasRich) {
          if (b.poetry) el.innerHTML = '<p class="poetry-block poetry-epigraph">「' + escapeHtml(b.poetry) + '」</p>';
          else el.innerHTML = '<span class="no-data">' + t('detail.noPoetry') + '</span>';
          return;
        }
        var html = '';
        if (b.poetry) {
          html += '<p class="poetry-block poetry-epigraph">「' + escapeHtml(b.poetry) + '」</p>';
        }
        if (entry.anecdote) {
          html += '<section class="poetry-section"><h3>' + t('detail.anecdote') + '</h3><p>' + escapeHtml(entry.anecdote) + '</p>' + (window.BridgeI18n && window.BridgeI18n.getLang()==='en' ? '<p class="images-desc">' + t('detail.cultureZhNote') + '</p>' : '') + '</section>';
        }
        if (entry.poetryRefs) {
          html += '<section class="poetry-section"><h3>' + t('detail.poetryRefs') + '</h3><p>' + escapeHtml(entry.poetryRefs) + '</p></section>';
        }
        if (entry.culturalInsight) {
          html += '<section class="poetry-section"><h3>' + t('detail.insight') + '</h3><p>' + escapeHtml(entry.culturalInsight) + '</p></section>';
        }
        el.innerHTML = html;
      }

      function render(b, cultureEntry) {
        window.__detailBridge = b; window.__detailCulture = cultureEntry;
        document.getElementById('bridgeName').textContent = bn(b.name);
        document.getElementById('bridgeSubtitle').textContent = (f(b.dynasty) || '') + (b.year != null ? ' · ' + yl(b.year) : '') + ' · ' + (f(b.province) || '') + (b.city ? ' ' + b.city : '');
        var rows = [
          [t('detail.place'), (f(b.province) || '—') + (b.city ? ' / ' + b.city : '')],
          [t('detail.type'), f(b.type) || '—'],
          [t('detail.material'), f(b.material) || '—'],
          [t('detail.length'), b.length != null ? b.length + ' m' : '—'],
          [t('detail.span'), b.span != null ? b.span + ' m' : '—'],
          [t('detail.width'), b.width != null ? b.width + ' m' : '—'],
          [t('detail.protection'), formatProtection(b)]
        ];
        document.getElementById('infoTable').innerHTML = rows.map(function(r) {
          return '<tr><th>' + r[0] + '</th><td>' + r[1] + '</td></tr>';
        }).join('');
        var compareWrapReset = document.getElementById('compareSliderWrap');
        if (compareWrapReset) compareWrapReset.style.display = 'none';

        var appearanceBox = document.getElementById('appearanceBox');
        var structureBox = document.getElementById('structureSvg');
        var captionEl = document.getElementById('appearanceCaption');
        var appearanceUrls = getAppearanceUrls(b.name).concat(b.image ? [b.image] : []);
        /* 须先换外观再换线稿：否则线稿 onload 若同步触发，appearanceBox 仍为上一座桥的图，对比条会错配 */
        tryImageWithFallback(appearanceBox, appearanceUrls, getAppearanceSvg(b.type), 'appearance-img', function() {
          var img = appearanceBox.querySelector('img');
          var fromBridgeFolder = img && img.src && (img.src.indexOf(bridgeFolder) === 0 || img.src.indexOf('/桥/') >= 0 || img.src.indexOf('%E6%A1%A5/') >= 0);
          captionEl.style.display = fromBridgeFolder ? 'none' : 'block';
          syncCompareSlider();
        });
        captionEl.style.display = 'none';

        tryImageWithFallback(structureBox, getLineArtUrls(b.name), getStructureSvg(b.type), 'structure-img', syncCompareSlider);

        var lineArtImg = structureBox.querySelector('img');
        var lineArtActionsEl = document.getElementById('lineArtActions');
        if (lineArtActionsEl) {
          if (lineArtImg && lineArtImg.src) {
            var safeName = (b.name || '线稿').replace(/[/\\?*:|"]/g, '-');
            lineArtActionsEl.innerHTML = '点击图片可放大 · <a href="' + lineArtImg.src + '" download="' + safeName + '-线稿图.png">下载线稿图</a>';
            lineArtActionsEl.style.display = 'block';
          } else {
            lineArtActionsEl.innerHTML = '点击示意图可放大';
            lineArtActionsEl.style.display = 'block';
          }
        }

        syncCompareSlider();
        renderIntroAndVideos(b);

        renderPoetryRich(b, cultureEntry || null);
        document.getElementById('poetryCard').style.display = 'block';
        var entry3d = document.getElementById('entry3dLink');
        if (entry3d) {
          entry3d.textContent = (window.BridgeI18n && window.BridgeI18n.getLang()==='en' ? 'Enter ' : '进入 ') + bn(b.name) + ' →';
          entry3d.href = 'bridge-3d.html?name=' + encodeURIComponent(b.name) + '&from=detail';
          entry3d.style.display = 'inline-flex';
        }
        document.getElementById('detailWrap').style.display = 'block';
        document.getElementById('backLink').href = backUrl();
      }

      function openLightbox(content) {
        var lb = document.getElementById('lightbox');
        var contentEl = document.getElementById('lightboxContent');
        contentEl.innerHTML = '';
        contentEl.removeAttribute('class');
        if (typeof content === 'string') {
          if (content.indexOf('<') >= 0) {
            contentEl.innerHTML = content;
            var svg = contentEl.querySelector('svg');
            if (svg) {
              svg.removeAttribute('style');
              contentEl.className = 'lightbox-svg';
            }
          } else {
            var img = document.createElement('img');
            img.src = content;
            img.alt = '大图预览';
            contentEl.appendChild(img);
          }
        } else if (content && content.tagName === 'IMG') {
          var img2 = document.createElement('img');
          img2.src = content.src;
          img2.alt = content.alt || '大图预览';
          contentEl.appendChild(img2);
        }
        lb.classList.add('open');
        lb.setAttribute('aria-hidden', 'false');
        document.body.style.overflow = 'hidden';
      }
      function closeLightbox() {
        var lb = document.getElementById('lightbox');
        lb.classList.remove('open');
        lb.setAttribute('aria-hidden', 'true');
        document.body.style.overflow = '';
      }
      function setupLightbox() {
        var detailWrap = document.getElementById('detailWrap');
        var lb = document.getElementById('lightbox');
        if (!detailWrap || !lb) return;
        detailWrap.addEventListener('click', function(e) {
          var box = e.target.closest('.diagram-box');
          if (!box) return;
          var wrap = box.querySelector('.svg-wrap');
          var img = box.querySelector('img');
          var clickedInWrap = wrap && wrap.contains(e.target);
          if (img && img.src && (e.target === img || clickedInWrap)) {
            e.preventDefault();
            openLightbox(img.src);
          } else if (clickedInWrap && wrap.querySelector('svg')) {
            e.preventDefault();
            openLightbox(wrap.innerHTML.trim());
          }
        });
        lb.addEventListener('click', function(e) {
          if (e.target === lb || e.target.closest('.lightbox-close')) closeLightbox();
        });
        document.getElementById('lightboxClose').addEventListener('click', closeLightbox);
        document.addEventListener('keydown', function(e) {
          if (e.key === 'Escape' && lb.classList.contains('open')) closeLightbox();
        });
      }

      function init() {
        document.getElementById('backLink').href = backUrl();
        var notFoundBack = document.getElementById('backLinkNotFound');
        if (notFoundBack) notFoundBack.href = backUrl();
        setupLightbox();
        if (!name) {
          document.getElementById('notFound').style.display = 'block';
          return;
        }
        Promise.all([
          fetch('data/bridges.json').then(function(r) { return r.json(); }),
          fetch('data/poetry-culture.json').then(function(r) { return r.json(); }).catch(function() { return { entries: {} }; })
        ])
          .then(function(results) {
            bridges = results[0];
            var pc = results[1] || {};
            var entries = pc.entries || {};
            bridge = bridges.filter(function(b) { return b.name === name; })[0];
            if (bridge) {
              document.title = bridge.name + ' - 桥梁档案 · 千古飞虹';
              render(bridge, entries[bridge.name]);
            } else {
              document.getElementById('notFound').style.display = 'block';
            }
          })
          .catch(function() { document.getElementById('notFound').style.display = 'block'; });
      }
      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
      else init();
    
      document.addEventListener('bridge:langchange', function () {
        if (window.__detailBridge) render(window.__detailBridge, window.__detailCulture);
      });
})();
  </script>
  <audio id="bgMusic" loop playsinline preload="metadata">
    <source src="assets/高山流水.mp3" type="audio/mpeg">
  </audio>
  <script src="assets/bg-music.js" defer></script>
  <script>
    (function () {
      if (!window.QianhongAgent) return;
      QianhongAgent.init({
        getBridge: function () {
          return new URLSearchParams(location.search).get('name') || '';
        }
      });
      var nav = document.getElementById('navArchivist');
      if (nav) {
        nav.addEventListener('click', function (e) {
          e.preventDefault();
          var name = new URLSearchParams(location.search).get('name') || '';
          QianhongAgent.openArchivist({
            bridge: name || undefined,
            q: name ? '介绍' + name : '',
            autoAsk: !!name,
            source: 'bridge_detail'
          });
        });
      }
    })();
  </script>
