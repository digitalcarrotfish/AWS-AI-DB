<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title data-i18n="closing.title">余韵 · 古桥雅韵</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Noto+Serif+SC:wght@400;500;600;700&family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/bg-music.css">
  <link rel="stylesheet" href="assets/bridge-agent.css">
  <link rel="stylesheet" href="assets/bridge-assistant.css">
  <script src="config.js"></script>
  <script src="assets/bridge-agent.js"></script>
  <script src="assets/bridge-assistant.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Noto Serif SC", "Source Han Serif CN", "SimSun", serif;
      min-height: 100dvh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      color: #e8e4dc;
      background: #060a0f;
    }
    body::-webkit-scrollbar { width: 8px; }
    body::-webkit-scrollbar-track { background: rgba(20,24,32,0.6); }
    body::-webkit-scrollbar-thumb { background: rgba(139,115,85,0.45); border-radius: 4px; }

    .shell {
      min-height: 100dvh;
      position: relative;
      display: flex;
      flex-direction: column;
    }
    .shell::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background:
        radial-gradient(ellipse 120% 80% at 50% -20%, rgba(90, 60, 30, 0.22) 0%, transparent 55%),
        radial-gradient(ellipse 70% 50% at 100% 50%, rgba(40, 55, 85, 0.35) 0%, transparent 50%),
        radial-gradient(ellipse 60% 45% at 0% 80%, rgba(55, 35, 25, 0.2) 0%, transparent 45%),
        linear-gradient(168deg, rgba(10, 16, 24, 0.9) 0%, rgba(18, 26, 38, 0.88) 35%, rgba(12, 18, 28, 0.9) 70%, rgba(7, 10, 14, 0.92) 100%),
        url("assets/ink-bridge-bg.png") center center / cover no-repeat fixed;
    }
    .shell::after {
      content: '';
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      opacity: 0.04;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }

    .content {
      position: relative;
      z-index: 1;
      flex: 1;
      display: flex;
      flex-direction: column;
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
      padding: 20px 24px 32px;
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      padding-bottom: 18px;
      margin-bottom: 8px;
      border-bottom: 1px solid transparent;
      border-image: linear-gradient(90deg, transparent, rgba(180, 150, 100, 0.45) 20%, rgba(180, 150, 100, 0.45) 80%, transparent) 1;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      text-decoration: none;
      color: inherit;
      min-width: 0;
    }
    .brand:hover .brand-title { color: #f0e8dc; }
    .seal {
      width: 52px;
      height: 52px;
      flex-shrink: 0;
      background: linear-gradient(145deg, rgba(35, 40, 48, 0.95) 0%, rgba(20, 24, 30, 0.98) 100%);
      border: 2px solid rgba(180, 145, 95, 0.55);
      border-radius: 4px;
      color: #d4b896;
      font-weight: 700;
      font-size: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 0 1px rgba(0,0,0,0.5), 0 8px 32px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.06);
    }
    .brand-title {
      font-size: clamp(1.2rem, 2.8vw, 1.45rem);
      font-weight: 700;
      letter-spacing: 0.22em;
      color: #e6dcc8;
      line-height: 1.3;
      text-shadow: 0 2px 24px rgba(0,0,0,0.5);
      transition: color 0.2s;
    }
    .brand-sub {
      font-size: 0.72rem;
      color: #8a7d72;
      margin-top: 6px;
      letter-spacing: 0.14em;
    }

    .site-nav {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.78rem;
      letter-spacing: 0.12em;
    }
    .site-nav a {
      color: #9a8c7a;
      text-decoration: none;
      transition: color 0.2s;
    }
    .site-nav a:hover { color: #d4b896; }
    .site-nav .dot { color: rgba(180,150,100,0.35); user-select: none; }

    .hero-wrap {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr;
      gap: 28px;
      align-items: stretch;
      min-height: 0;
      padding-top: 12px;
    }
    @media (min-width: 900px) {
      .hero-wrap {
        grid-template-columns: minmax(0, 1.05fr) minmax(280px, 0.75fr);
        gap: 40px;
        align-items: center;
      }
    }

    .hero-card {
      position: relative;
      text-align: center;
      padding: 40px 32px 44px;
      background: linear-gradient(165deg, rgba(22, 28, 38, 0.92) 0%, rgba(14, 18, 26, 0.96) 100%);
      border: 1px solid rgba(160, 130, 85, 0.28);
      border-radius: 2px;
      box-shadow: 0 24px 64px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.04);
    }
    .hero-card::before,
    .hero-card::after {
      content: '';
      position: absolute;
      width: 20px;
      height: 20px;
      border-color: rgba(180, 150, 100, 0.45);
      border-style: solid;
      pointer-events: none;
    }
    .hero-card::before { top: 12px; left: 12px; border-width: 2px 0 0 2px; }
    .hero-card::after { bottom: 12px; right: 12px; border-width: 0 2px 2px 0; }
    .corner-br {
      position: absolute;
      top: 12px; right: 12px;
      width: 20px; height: 20px;
      border-top: 2px solid rgba(180, 150, 100, 0.35);
      border-right: 2px solid rgba(180, 150, 100, 0.35);
      pointer-events: none;
    }
    .corner-bl {
      position: absolute;
      bottom: 12px; left: 12px;
      width: 20px; height: 20px;
      border-bottom: 2px solid rgba(180, 150, 100, 0.35);
      border-left: 2px solid rgba(180, 150, 100, 0.35);
      pointer-events: none;
    }

    .stamp {
      display: inline-block;
      padding: 10px 22px;
      border: 1px solid rgba(180, 150, 100, 0.5);
      color: #c9a87a;
      font-size: 0.82rem;
      font-weight: 600;
      letter-spacing: 0.42em;
      text-indent: 0.42em;
      margin-bottom: 26px;
      background: rgba(8, 12, 18, 0.6);
      position: relative;
    }
    .stamp::before {
      content: '';
      position: absolute;
      inset: -5px;
      border: 1px dashed rgba(160, 130, 90, 0.22);
      pointer-events: none;
    }

    h1 {
      font-family: "Ma Shan Zheng", "Noto Serif SC", serif;
      font-size: clamp(2rem, 5vw, 2.65rem);
      font-weight: 400;
      line-height: 1.3;
      margin-bottom: 20px;
      color: #f0e8dc;
      text-shadow: 0 2px 1px rgba(0,0,0,0.45), 0 8px 32px rgba(0,0,0,0.35), 0 0 80px rgba(160, 120, 70, 0.12);
    }

    .lead {
      font-size: 0.95rem;
      line-height: 1.85;
      color: #a0988c;
      margin-bottom: 24px;
      max-width: 28em;
      margin-left: auto;
      margin-right: auto;
    }

    .closing-summary {
      display: none;
      font-size: 0.88rem;
      line-height: 1.95;
      color: #b5aa9c;
      text-align: justify;
      text-justify: inter-ideograph;
      max-width: 36em;
      margin: 0 auto 28px;
      padding: 20px 22px;
      background: rgba(8, 12, 20, 0.55);
      border: 1px solid rgba(160, 130, 85, 0.22);
      border-radius: 2px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.03);
    }
    .closing-summary.visible { display: block; }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      max-width: 300px;
      margin: 0 auto;
    }
    .actions a {
      display: block;
      text-align: center;
      text-decoration: none;
      font-size: 0.92rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      padding: 14px 24px;
      border-radius: 2px;
      transition: filter 0.15s, border-color 0.15s, box-shadow 0.2s;
    }
    .actions a.primary {
      color: #1a1510;
      background: linear-gradient(180deg, #e8d5bc 0%, #c9a87a 45%, #a08055 100%);
      box-shadow: 0 4px 20px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.25);
    }
    .actions a.primary:hover { filter: brightness(1.06); }
    .actions a.secondary {
      border: 1px solid rgba(160, 130, 85, 0.28);
      color: #d4c8b8;
      background: rgba(12, 16, 24, 0.75);
    }
    .actions a.secondary:hover {
      border-color: rgba(212, 184, 150, 0.45);
      color: #f0e8dc;
    }

    .footnote {
      margin-top: 28px;
      font-size: 0.65rem;
      color: #4a453e;
      line-height: 1.7;
      letter-spacing: 0.1em;
    }

    .hero-side {
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      min-height: 260px;
      padding: 24px;
      border: 1px solid rgba(120, 100, 70, 0.15);
      background: linear-gradient(160deg, rgba(18, 22, 32, 0.5) 0%, rgba(10, 14, 22, 0.65) 100%);
      border-radius: 2px;
    }
    @media (min-width: 900px) {
      .hero-side { display: flex; }
    }
    .hero-side::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 50% 30%, rgba(160, 120, 70, 0.12) 0%, transparent 55%);
      pointer-events: none;
    }
    .vertical-title {
      writing-mode: vertical-rl;
      text-orientation: mixed;
      font-family: "Ma Shan Zheng", serif;
      font-size: clamp(2.5rem, 4.2vw, 3.2rem);
      letter-spacing: 0.35em;
      color: rgba(200, 175, 130, 0.22);
      user-select: none;
      line-height: 1.6;
      text-shadow: 0 0 40px rgba(0,0,0,0.5);
    }
    .side-rule {
      width: 1px;
      height: 100px;
      margin: 22px 0;
      background: linear-gradient(180deg, transparent, rgba(180, 150, 100, 0.35), transparent);
    }
    .side-caption {
      writing-mode: vertical-rl;
      font-size: 0.75rem;
      letter-spacing: 0.5em;
      color: #6d655c;
      line-height: 2;
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="content">
      <header class="top-bar">
        <a class="brand" href="index.html">
          <div class="seal" aria-hidden="true">桥</div>
          <div>
            <div class="brand-title" data-i18n="brand.title">古桥 雅韵</div>
            <div class="brand-sub" data-i18n="brand.sub">中国古代桥梁 · 数字博物馆</div>
          </div>
        </a>
        <nav class="site-nav" data-i18n-aria="nav.site" aria-label="站内导航">
          <a href="index.html" data-i18n="nav.cover">封面</a>
          <span class="dot" aria-hidden="true">·</span>
          <a href="museum.html" data-i18n="nav.museum">图鉴主展区</a>
          <span class="dot" aria-hidden="true">·</span>
          <button type="button" class="lang-btn" data-lang-toggle aria-label="English">EN</button>
          <button type="button" class="music-btn" id="musicToggle" data-i18n="music.label" data-i18n-aria="music.aria" data-i18n-title="music.title" aria-pressed="false" aria-label="背景音乐：高山流水" title="背景音乐《高山流水》">音乐</button>
        </nav>
      </header>

      <div class="hero-wrap">
        <main class="hero-card">
          <span class="corner-br" aria-hidden="true"></span>
          <span class="corner-bl" aria-hidden="true"></span>
          <div class="stamp" data-i18n="closing.stamp">余韵悠长</div>
          <h1 data-i18n="closing.hero" data-i18n-html>感谢走进<br>古桥世界</h1>
          <p class="lead" data-i18n="closing.lead" data-i18n-html>愿这些跨越千年的桥影与数据，曾在您心中激起一丝涟漪。<br>山河依旧，飞虹如昨。</p>
          <p class="closing-summary" id="closingSummary"></p>
          <div class="actions">
            <a class="primary" href="museum.html" data-i18n="closing.backMuseum">返回图鉴主展区</a>
            <a class="secondary" href="index.html" data-i18n="closing.backCover">返回封面</a>
          </div>
          <p class="footnote" data-i18n="closing.footnote" data-i18n-html>《千古飞虹：中国古代桥梁工程图鉴》<br>数据可视化与数字展陈 · 仅供学习交流</p>
        </main>
        <aside class="hero-side" aria-hidden="true">
          <div class="vertical-title" data-i18n="closing.sideTitle">谢谢观展</div>
          <div class="side-rule"></div>
          <p class="side-caption" data-i18n="closing.sideCaption">桥影入梦水长流</p>
        </aside>
      </div>
    </div>
  </div>
  <audio id="bgMusic" loop playsinline preload="metadata">
    <source src="assets/高山流水.mp3" type="audio/mpeg">
  </audio>
  <script src="assets/i18n.js"></script>
  <script src="assets/bg-music.js" defer></script>
  <script>
    (function() {
      var zhSummary = '';
      function renderSummary() {
        var el = document.getElementById('closingSummary');
        if (!el) return;
        var I = window.BridgeI18n;
        var text = (I && I.getLang() === 'en')
          ? I.t('closing.summaryEn')
          : (zhSummary || (I ? I.t('closing.summaryEn') : ''));
        if (!text) return;
        el.textContent = text;
        el.classList.add('visible');
      }
      document.addEventListener('bridge:langchange', renderSummary);
      fetch('data/poetry-culture.json')
        .then(function(r) { return r.json(); })
        .then(function(data) {
          zhSummary = (data && data.globalSummary) || '';
          renderSummary();
        })
        .catch(function() { renderSummary(); });
      if (window.QianhongAgent) {
        QianhongAgent.init({ autoTrack: false });
      }
    })();
  </script>
</body>
</html>
